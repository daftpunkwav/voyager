name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The CI only needs to read the repo and nothing else; scoping the token
# here also covers every job, so no per-job block is required.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Squash-only repository: the PR title becomes the permanent commit
  # message on main, so it is cheap to enforce the convention here and
  # expensive to fix it after the fact. Kept as a tiny shell check instead
  # of a third-party action to avoid adding a supply-chain dependency for
  # a regex.
  pr-title:
    name: pr title (conventional commits)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ${#TITLE} -gt 72 ]]; then
            echo "::error::PR title is ${#TITLE} chars; keep it at 72 max."
            exit 1
          fi
          # "ci" is part of the repo's de-facto type set (see e.g. PR #5) and
          # "Revert: <original>" is the prescribed revert form. Only the first
          # letter of the subject is forced lowercase — proper nouns (Vite,
          # CSP, uv) stay legal.
          if [[ ! "$TITLE" =~ ^(Revert:\ .+|(feat|fix|docs|refactor|chore|test|perf|ci)(\([a-z0-9._/-]+\))?(!)?:\ [a-z].+)$ ]]; then
            echo "::error::PR title must match '<type>(<scope>)?: <subject>' — type is one of feat/fix/docs/refactor/chore/test/perf/ci, subject starts lowercase; or 'Revert: <original>'."
            echo "Got: $TITLE"
            exit 1
          fi

  # PR policy: docs-only PRs (the bilingual doc set changes often) skip
  # both gates. Classification is deliberately fail-open: anything
  # unrecognized flips the flag back on, and .github/* always triggers
  # everything so the pipeline can never edit its own way out of being
  # checked.
  #
  # Push and dispatch policy: verify main itself, always in full. This job
  # must therefore run on every event — the gates depend on it, and a
  # skipped dependency skips its dependents, which silently no-opped the
  # whole workflow on push once already (2026-10-03). Off a pull_request
  # there is no base to diff against, so classify as all-changed and skip
  # the full-history checkout.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      py: ${{ steps.shortcut.outputs.py || steps.filter.outputs.py }}
      web: ${{ steps.shortcut.outputs.web || steps.filter.outputs.web }}
    steps:
      - name: Classify as all-changed (push, workflow_dispatch)
        id: shortcut
        if: github.event_name != 'pull_request'
        run: |
          echo "py=true" >> "$GITHUB_OUTPUT"
          echo "web=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Compute changed paths against the base branch
        id: filter
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          py=false
          web=false
          while IFS= read -r f; do
            case "$f" in
              .github/*|agent/*|packages/*|scripts/*|pyproject.toml|uv.lock|import-linter.ini|.python-version)
                py=true ;;
            esac
            case "$f" in
              .github/*|apps/web/*|package.json|package-lock.json|.nvmrc)
                web=true ;;
            esac
          done < <(git diff --name-only "$BASE...HEAD")
          echo "py=$py" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "python paths: $py, web paths: $web"

  gate-py:
    name: gate:py (ruff + import-linter + mypy + pytest + graph:check)
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python workspace
        run: uv sync

      - name: ruff format/check
        run: npm run lint:py

      - name: import-linter layering contracts
        run: npm run lint:imports

      - name: mypy
        run: npm run typecheck:py

      - name: pytest (branch coverage, 90% floor)
        run: npm run test:py

      - name: dependency graph freshness
        run: npm run graph:check

  gate-web:
    name: gate:web (tsc + eslint + vitest + i18n keys + prettier + build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node workspace
        run: npm ci

      - name: tsc
        run: npm run typecheck:web

      - name: eslint
        run: npm run lint:web

      - name: vitest (coverage gated)
        run: npm run test:web:cov

      - name: i18n key parity
        run: npm run i18n:web

      - name: prettier
        run: npm run format:web

      # The test gate compiles nothing: a vite-major upgrade can pass every
      # check above and still fail the production minifier (lightningcss
      # broke on a transition shorthand exactly this way). Build to catch it.
      - name: production build (vite)
        run: npm run build:web

  docs:
    name: docs (i18n registry + internal links)
    # Deliberately unconditional (no path filter): the checks are pure
    # local file verification, cost seconds, and gate the bilingual
    # registry that nothing else polices — a doc edited without
    # re-recording its consistency hashes must not land.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: consistency records
        run: npm run docs:i18n

      - name: internal links and pair reciprocity
        run: npm run docs:links

  e2e-web:
    name: e2e (playwright chromium smoke)
    # Path-gated like the unit gates: only web-surface changes need a
    # browser pass (skipped counts as success for py-/docs-only PRs). The
    # push/dispatch classification is all-changed, so main itself always
    # gets the full browser run.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Node workspace
        run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      # Backend on a fresh data dir (the runner has none, so uvicorn's
      # factory path just creates it); LLM calls fail by design and the
      # specs tolerate that. The wait loop prints the log when it never
      # turns healthy.
      - name: Install Python workspace
        run: uv sync

      - name: Start backend on :8000
        env:
          # Throwaway key material for the per-run scratch data dir only —
          # not a secret. The runner has no .env, and without key material
          # SecretStore is unavailable, which takes set_api_key (and thus
          # the chat composer seed) down with it.
          SECRETS_ENCRYPTION_KEY: e2e-scratch-only-never-a-real-key
        run: |
          uv run uvicorn host.assemble:build --factory --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "backend healthy after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend did not become healthy"; cat backend.log; exit 1

      - name: Run e2e specs
        run: npm run test:e2e -w web

      - name: Dump backend log
        if: failure()
        run: tail -100 backend.log
