name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-py:
    name: gate:py (ruff + import-linter + mypy + pytest + graph:check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - uses: d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install Python workspace
        run: uv sync

      - name: ruff format/check
        run: npm run lint:py

      - name: import-linter layering contracts
        run: npm run lint:imports

      - name: mypy
        run: npm run typecheck:py

      - name: pytest (branch coverage, 90% floor)
        run: npm run test:py

      - name: dependency graph freshness
        run: npm run graph:check

  gate-web:
    name: gate:web (tsc + eslint + vitest + i18n keys + prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: 49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node workspace
        run: npm ci

      - name: tsc
        run: npm run typecheck:web

      - name: eslint
        run: npm run lint:web

      - name: vitest
        run: npm run test:web

      - name: i18n key parity
        run: npm run i18n:web

      - name: prettier
        run: npm run format:web
