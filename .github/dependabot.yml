# Dependabot configuration.
#
# The github-actions entry is the important one: every "uses:" in the workflows is
# pinned to a full commit SHA, and this is what keeps those pins current without
# anyone hand-editing them. Tag-based refs (dtolnay/rust-toolchain@<version>,
# taiki-e/install-action@<branch>) are intentionally left unpinned - pinning those
# would freeze the toolchain and break the msrv/stable gates.
#
# Updates are grouped so the required-approval flow stays reviewable.
#
# Groups deliberately exclude semver-major bumps: a mixed group PR that
# sneaks in e.g. vite 8 + typescript 7 + vitest 5 is unreviewable and has
# broken the web gate before. Major updates fall out as individual PRs so
# each migration is judged on its own.
#
# The three ecosystems run on different weekdays so their PRs do not pile
# up on one morning and rebase on each other.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    commit-message:
      prefix: "chore(deps-py)"
    labels:
      - "dependencies"
      - "python"
    groups:
      uv:
        patterns: ["*"]
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    # "Highest usable" cap: typescript-eslint@8 (latest) declares peer
    # typescript <6.1.0, so typescript 7 is uninstallable until that lifts.
    # Remove the cap on the day the peer range widens.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    commit-message:
      prefix: "chore(deps-js)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm:
        patterns: ["*"]
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"