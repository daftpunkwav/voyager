# Import contracts for the layered architecture (docs/architecture.md
# "Layering and dependency rules").
#
# Law 1 (full-layer decoupling): platform never imports business layers; domains
# never import each other nor the composition root; the agent never imports
# domain implementations; only the composition root (host) may wire domains.
# Cross-domain and human/agent traffic must go through the capability registry
# (late-bound call / events), never through direct implementation imports.
#
# NOTE: every workspace member is an installed top-level package (src layout,
# see pyproject.toml [tool.uv.workspace]), so the contracts name
# import packages directly: domains by directory name, platform as platform_*.
# apps-bridge-only (frontend hits the gateway only) is a TS-side rule outside
# import-linter's scope; the backend side of it is locked by
# packages/host/tests/test_import_boundaries.py.

[importlinter]
root_packages =
    agent
    host
    gateway
    browser
    code_exec
    graph
    llm
    notes
    office
    settings
    sources
    platform_actor
    platform_capability
    platform_contracts
    platform_eventbus
    platform_health
    platform_secrets
    platform_settings
    platform_webguard

[importlinter:contract:platform-no-business]
name = Platform packages never import business layers (law 1)
type = forbidden
source_modules =
    platform_actor
    platform_capability
    platform_contracts
    platform_eventbus
    platform_health
    platform_secrets
    platform_settings
    platform_webguard
forbidden_modules =
    agent
    host
    gateway
    browser
    code_exec
    graph
    llm
    notes
    office
    settings
    sources

[importlinter:contract:domains-independent]
name = Domains never import each other (law 1; cross-domain only via capability call / events)
type = independence
modules =
    browser
    code_exec
    gateway
    graph
    llm
    notes
    office
    settings
    sources

[importlinter:contract:host-only-wiring]
name = Only the composition root may import domain wiring (law 1; design §8.2 host-only-wiring)
type = forbidden
source_modules =
    browser
    code_exec
    gateway
    graph
    llm
    notes
    office
    settings
    sources
forbidden_modules =
    host

[importlinter:contract:agent-no-domain]
name = Agent never imports domains, the gateway or the composition root (law 1)
type = forbidden
source_modules =
    agent
forbidden_modules =
    host
    gateway
    browser
    code_exec
    graph
    llm
    notes
    office
    settings
    sources

[importlinter:contract:aggregate-submodules-independent]
name = Aggregate services' submodules never import each other (law 1; sources/office modules talk via _shared and the aggregate top level only)
type = independence
modules =
    sources.modules.doc
    sources.modules.repo
    sources.modules.web
    office.modules.doc
    office.modules.slides

[importlinter:contract:graph-pipelines-independent]
name = Graph pipelines never import each other (law 1; the two engines share nothing below the aggregate top level)
type = independence
modules =
    graph.engines.python
    graph.engines.c
