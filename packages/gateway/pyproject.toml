[project]
name = "gateway"
version = "0.1.0"
description = "Aggregating REST/SSE shell: mounts domains via injected MountSpec, zero domain imports"
requires-python = ">=3.11"
dependencies = [
    "platform-actor",
    "platform-capability",
    "platform-contracts",
    "platform-eventbus",
    "platform-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
