[project]
name = "settings"
version = "0.1.0"
description = "Settings domain service"
requires-python = ">=3.11"
dependencies = [
    "platform-actor",
    "platform-capability",
    "platform-contracts",
    "platform-eventbus",
    "platform-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/settings"]
