[project]
name = "sources"
version = "0.1.0"
description = "Resource library domain service (repos, documents, pages)"
requires-python = ">=3.14"
dependencies = [
    "platform-actor",
    "platform-capability",
    "platform-contracts",
    "platform-eventbus",
    "platform-secrets",
    "platform-webguard",
    "platform-settings",
    "defusedxml>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sources"]
