[project]
name = "platform-settings"
version = "0.1.0"
description = "settings framework: schema/defaults/secret marking/change events (§7.9)"
requires-python = ">=3.11"
dependencies = ["platform-contracts", "platform-eventbus"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_settings"]
