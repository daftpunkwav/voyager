[project]
name = "platform-webguard"
version = "0.1.0"
description = "shared URL safety guard: SSRF policy, DNS resolve-and-pin, per-hop redirect checks"
requires-python = ">=3.11"
dependencies = ["httpx>=0.25.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_webguard"]
