[project]
name = "platform-eventbus"
version = "0.1.0"
description = "event streaming: persisted event log (append-only table) + publish/subscribe + cursors (§7.2)"
requires-python = ">=3.11"
dependencies = ["platform-contracts"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_eventbus"]
