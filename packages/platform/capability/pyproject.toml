[project]
name = "platform-capability"
version = "0.1.0"
description = "capability framework: define once, generate REST + MCP dual protocol; entry enforces auth/quota/audit"
requires-python = ">=3.11"
dependencies = ["platform-contracts", "platform-actor"]

[project.optional-dependencies]
rest = ["fastapi>=0.104.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "fastapi>=0.104.0", "httpx>=0.25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_capability"]
