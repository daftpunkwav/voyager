[project]
name = "platform-secrets"
version = "0.1.0"
description = "secret keeping: encrypted at rest, on-demand retrieval, framework-level redaction (§7.7)"
requires-python = ">=3.11"
dependencies = ["cryptography>=41.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_secrets"]
