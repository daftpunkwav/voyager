# Subagent execution-mode prompts: react / cot / tot / got / plan_execute /
# reflexion (direct has none). Placeholders ({name}) are filled at the call
# site via agent.prompts.render; JSON braces like {"ranking": ...} are not
# placeholders and stay literal.
#
# Language split: model-facing instructions are English; the budget/interrupt
# reports are turn results rendered in the chat UI and stay in Chinese.

[modes]
# Shared stepwise scaffolds: the per-step instruction (cot + plan_execute) and
# the identical loop-abort report (react raises it in two places).
step_instruction = "[Step {index}/{total}] {step}\nComplete this step; call tools if you need external information."
loop_abort = "[中断] 疑似死循环:{tool} 以相同参数在最近 {window} 次调用中重复达 {threshold} 次;已停止执行。请换参数、换工具或先向用户说明。"

[modes.cot]
plan = "Reason step by step before concluding. Break the reasoning needed for this task into numbered steps (one step per line, starting with a verb, at most {max_steps} steps); do not call tools."
synthesis = "The steps above have completed the task. Synthesize the step results into the final answer: answer the task directly and note any unfinished steps (if any)."
# Conversational closing: the task-mode synthesis narration would leak
# workflow scaffolding into the group chat, so chat turns close with the
# natural-reply discipline instead.
chat_synthesis = [
    "The steps above have finished in the background. Synthesize their results into one natural chat reply to the user: give the content itself; if anything is unfinished, mention it briefly in one sentence.",
    "@common.chat_reply_discipline",
]
budget = "[预算] 已达{reason},链式推理中途收尾:{done}/{total} 步完成。可在设置提高 agent.rounds.* 后继续。"
skipped = "因预算限制未执行的步骤:{steps}"

[modes.plan_execute]
plan = "First produce a step-by-step execution plan, without calling tools: list the numbered steps needed to complete the task (one step per line, starting with a verb, at most {max_steps} steps), ending with the completion criteria."
replan = "The step above got stuck. Revise the remaining steps based on what happened: list new numbered steps (completed ones need not be redone), changing approach if necessary. Do not call tools.\n(Remaining unexecuted steps: {remaining})"
report = "The task is finished. Synthesize the process into the final answer: answer the task directly and briefly note each step's completion status (for anything unfinished)."
chat_report = [
    "The steps above have finished in the background. Synthesize the execution into one natural chat reply to the user: give the content itself; if anything is unfinished, mention it briefly in one sentence.",
    "@common.chat_reply_discipline",
]
budget = "[预算] 已达{reason},计划执行中途收尾:{done}/{total} 步完成。可在设置提高 agent.rounds.* 后继续。"
skipped = "因预算限制未执行的步骤:{steps}"

[modes.tot]
generate = "Propose one candidate approach for this task (track {i}/{n}): the approach itself, why it works, and the key risks. Be concise; do not call tools."
judge = "Below are {n} candidate approaches for the same task (labeled [A]/[B]/[C]). Evaluate and rank them; output ONLY one JSON object: {\"ranking\": [\"letter of the best option\", ...]}."
expand = "Expand option {letter} into a complete answer for this task: give the result directly, without leaving an option skeleton."
pick = "Below are two complete answers for this task (labeled [A]/[B]). Pick the better one; output ONLY one JSON object: {\"best\": \"letter\"}."
execute = "Execute this task following the selected option above; call tools if you need external information."
finalize = "Organize the selected option into the final answer and output it directly."

[modes.got]
# Fixed angle menu, cycled when the configured angle count exceeds it;
# consumers recover the items with splitlines(). The angle names surface in
# trace summaries shown to the user and stay in Chinese.
angle_menu = [
    "正确性与事实核查",
    "完整性与遗漏",
    "风险与反例",
    "可行性与成本",
]
angle = "Handle the task from the perspective of 「{angle}」; output the conclusion or the key points for that perspective. Do not call tools."
aggregate = "The above are outputs for the same task from different perspectives. Aggregate them into one coherent, complete final answer: make and explain explicit trade-offs where they conflict, merge where they complement, and do not drop key information from any perspective."
refine = "Check your aggregated draft against the per-perspective outputs above: point out key content that was lost or distorted, and output the revised complete answer (not a list of edits)."
execute = "Execute this task following the aggregated answer above; call tools if you need external information."

[modes.react]
continue_idle = "{mark} Observation: no tool call was produced this round. Continue with an Action: call a tool; if no tool is needed, state the reason in one sentence."
token_budget = "[预算] 已达 token 上限({max_tokens}),本回合收尾。{partial};可在设置提高 agent.rounds.max_tokens 后继续。"
partial_result = "部分结果:{text}"
no_final_text = "尚无最终文本产出"
overflow = "[中断] 上下文压缩后仍超出模型窗口;请缩短输入、清理会话，或检查 agent.context.window_tokens 与模型真实窗口是否一致。"
truncation = "[输出被截断] 已达模型单次输出上限,回答不完整;可在设置提高输出上限或让我分段继续。"
truncated_calls = "[未执行] 上一轮输出达到模型单次输出上限,以上工具调用的参数可能被截断,为避免以残缺参数执行已全部跳过;请检查后重新发起这些调用(必要时拆小参数)。"
tool_cap = "[中断] 已达工具调用上限({max_tool_calls});可在设置提高 agent.rounds.tool_max"
rounds_cap = "[中断] 已达 ReAct 轮数上限({max_rounds});可在设置提高 agent.rounds.max"

[modes.reflexion]
review = "Review whether the draft above adequately completes the task. Output exactly one of:\nADEQUATE: one sentence on why it is acceptable;\nREVISE: name the concrete problems first, then list what the next attempt should do (itemized).\nDo not call tools."
retry = "[Reflection] The previous attempt did not pass self-review. {review}\nRedo the task according to the reflection above."
