# Master-layer prompts: message arbitration, background-result synthesis,
# proactive outreach, the resident chat goal, task-completion evaluation,
# and the notice bodies that wake the host for team reports and task claims.
# Placeholders ({name}) are filled at the call site via agent.prompts.render.
#
# Language split: model-facing instructions are English; the chat goal and
# the notice bodies surface in the Chinese UI (right panel / chat notices)
# and stay in Chinese.

[orchestrator]
# Task-completion judge fed by evaluation.py after a dispatched run:
# LLM-as-judge scores the turn; feedback is written to episodic memory.
evaluation_system = "You are an evaluation engine. Reply strictly in JSON."
evaluation_judge = """You are an impartial evaluator assessing an AI assistant turn.
Goal: {subject}
User input: {prompt}
Assistant reply: {reply}

Evaluate if the assistant properly addressed the request. Output ONLY a JSON object with 'score' (float between 0.0 and 1.0) and 'feedback' (short explanation or advice for improvement):
{"score": 0.9, "feedback": "Clear and complete response."}"""

# Standing goal of the conversational session instance (sessions/manager.py); shown
# verbatim in the right-panel roster, hence Chinese.
chat_goal = "与用户对话,理解并满足需求。普通对话与顺手的小任务直接自己完成;确实需要多步骤或长时间后台执行时,才用 subagent(action=spawn) 派出任务型 subagent;不确定时经 ask_user 向用户提问。回复简洁有温度。"

arbiter_judge = "You are the message arbitration judge. Current task: {goal}\nNew user message: {text}\nIf the new message directly relates to the current task (supplements/corrections/parameters), reply with exactly: merge\nIf it is a new intent, reply with exactly: enqueue"

# Trailing newlines are part of the prompt: the raw result is appended after
# it. The digest lands in a Chinese chat notice, so the output language is
# pinned to Chinese.
synthesize_result = """[Task result digest] Below is the full result of the background subtask {name}. Compress it into a Chinese notice of at most 300 characters covering, in order: whether the task completed; key conclusions and outputs; critical data/paths/commands to preserve verbatim; unfinished items. Output only the notice body, no preamble:

"""

proactive_greeting = "The user just came online. Write a short greeting in Chinese, at most two sentences, natural and non-intrusive; you may mention one noteworthy background update if there is one; if nothing is worth mentioning, just greet."
proactive_followup = "The user never replied to this message: 「{topic}」。Write a follow-up in Chinese of at most two sentences — a reminder, not a push; if the topic no longer makes sense, output nothing."

# Notice body rendered in the chat UI: stays Chinese.
goal_resume = "[目标续跑] 目标「{goal}」:继续推进。若目标已完成,用 goal(action=status, status=done) 标记 done;受阻则标记 blocked 并说明原因。"

# Team report / task claim bodies ride chat notices: Chinese.
team_report_done = "[team-report] 团队成员 {member} 已完成任务,汇报如下:{summary}\n请向用户简短播报这一结果(一两句,署成员的名),并给出下一步建议。"
team_report_failed = "[team-report] 团队成员 {member} 的任务执行失败:{detail}\n请向用户如实说明失败情况,并给出可选的下一步(重试/换人/放弃)。"
task_claim = "[task-claim] 团队成员 {claimant} 认领了任务「{title}」({task_id}){note_line}\n请审阅:没问题就 taskboard(action=confirm, task_id) 拍板转入后台执行;成员有商议(要更多信息/容量不够)就先回应再定。"
task_claim_note = ",留言:{note}"
