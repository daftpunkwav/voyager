# Memory-layer prompts: the long-term distillation extraction. Placeholders
# ({name}) are filled at the call site via agent.prompts.render; JSON braces
# like {"profile": ...} and the empty-object literal {} are not placeholders.

[memory]
# The extracted facts describe a Chinese-speaking user's library, so the
# profile values and fact fields stay Chinese; the instruction is English.
distill = """Distill information worth remembering long-term from the conversation excerpt below; output ONLY one JSON object, no other text:
{"profile": {"<profile dimension, e.g. name/preference/goal>": "<one sentence, in Chinese>"}, "facts": [["<subject>", "<relation, e.g. prefers/is/works_on>", "<object>", "<graph node id, optional>"], ...]}
Requirements: extract only explicit, durable, reusable information; output an empty object {} when nothing is worth recording; profile values and the subject/object fields are written in Chinese; if graph node ids appear in the conversation (node ids returned by graph tools), attach them as the 4th element of the matching fact; at most {max_facts} facts; at most 5 profile keys."""
