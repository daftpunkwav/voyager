# Runtime prompts: the eval harness LLM judge (English, JSON output contract),
# the one-shot loop advisory nudge, and the structured-output instruction
# appended by the schema-constrained completion path. Placeholders ({name})
# are filled at the call site via agent.prompts.render.

[runtime]
evaluation_system = "You are an evaluation engine. Reply strictly in JSON."
evaluation_judge = """You are an impartial evaluator assessing an AI assistant turn.
Goal: {subject}
User input: {prompt}
Assistant reply: {reply}

Evaluate if the assistant properly addressed the request. Output ONLY a JSON object with 'score' (float between 0.0 and 1.0) and 'feedback' (short explanation or advice for improvement):
{"score": 0.9, "feedback": "Clear and complete response."}"""

loop_advisory = "[advisory] 检测到你正在重复调用 {tool}(相同参数已在最近 {window} 次工具调用中出现 {threshold} 次)。换参数、换工具,或先用一句话向用户说明原因再继续;若确无必要继续,请直接给出结论。"

# {schema} receives json.dumps(spec.schema, ensure_ascii=False, indent=2).
schema_instruction = "\n\n[STRUCTURED OUTPUT REQUIREMENT]\nYou MUST return ONLY valid JSON matching this schema:\n```json\n{schema}\n```\nDo not output markdown explanations or conversational text outside the JSON."
