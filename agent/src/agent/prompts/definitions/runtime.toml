# Runtime prompts: the one-shot loop advisory nudge and the structured-output
# instruction appended by the schema-constrained completion path.
# Placeholders ({name}) are filled at the call site via agent.prompts.render.

[runtime]
# User-role nudge fed back to the model mid-turn: English.
loop_advisory = "[advisory] You are repeating the same tool call: {tool} (identical arguments have appeared {threshold} times in the last {window} tool calls). Change the arguments or switch tools, or explain the reason to the user in one sentence first; if continuing is truly unnecessary, give your conclusion directly."

# {schema} receives json.dumps(spec.schema, ensure_ascii=False, indent=2).
schema_instruction = "\n\n[STRUCTURED OUTPUT REQUIREMENT]\nYou MUST return ONLY valid JSON matching this schema:\n```json\n{schema}\n```\nDo not output markdown explanations or conversational text outside the JSON."
