[project]
name = "agent"
version = "2.0.0"
description = "AI orchestration layer: reads the event flow, decides and acts through capabilities only"
requires-python = ">=3.11"
dependencies = [
    "platform-actor",
    "platform-capability",
    "platform-contracts",
    "platform-eventbus",
    "platform-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout (aligned with packages/<name>): code lives in src/agent/, tests
# stay at the member root. Editable install maps src/agent directly, so the
# repo root is no longer exposed on sys.path.
packages = ["src/agent"]
