---
# Codacy configuration.
#
# Tool and code-pattern enablement is governed by the repository's coding
# standard on the Codacy side and cannot be switched from this file, so the
# settings below are limited to the supported knobs: global path exclusions
# and per-tool path exclusions. Each exclusion narrows an engine to the paths
# where it produces actionable findings for this repository; the rationale is
# stated next to the entry.
exclude_paths:
  # Test suites legitimately use asserts (B101) and other patterns production
  # linters dislike; production code stays fully covered.
  - "**/tests/**"
  # Vendored third-party sources under the C engine (tree-sitter runtime and
  # grammars, simplecpp, lz4, zstd, verstable, wyhash, mimalloc). Upstream
  # code is not patched in this repository, so findings there cannot be
  # actioned.
  - "packages/graph/src/graph/engines/c/core/internal/engine/vendored/**"
  - "packages/graph/src/graph/engines/c/core/vendored/**"
  # Bundled third-party browser library (Skulpt Python-in-the-browser build).
  - "apps/web/public/vendor/**"
engines:
  # The engine's default ruleset for this repository targets Qwik
  # (noReactSpecificProps, useQwikValidLexicalScope) and flags className and
  # ordinary React event handlers throughout this React app. React-specific
  # lint enforcement lives in the repository's own ESLint flat config, which
  # CI runs with --max-warnings 0.
  biome:
    exclude_paths:
      - "apps/web/**"
  # The engine runs type-aware @typescript-eslint rules without type
  # information (no-confusing-void-expression, no-unnecessary-condition,
  # no-redundant-type-constituents, prefer-nullish-coalescing) and the base
  # no-unused-vars rule on TypeScript type signatures, flagging ordinary React
  # handlers and `(field: T) => void` members as unused. The repository's own
  # ESLint flat config (enforced in CI) is the authoritative JS/TS linter.
  eslint-8:
    exclude_paths:
      - "apps/web/**"
      - "scripts/**"
  # Reports every call to memcpy/strlen/open/getenv/... as an audit advisory
  # regardless of surrounding guards. The C sidecar is dormant (the Python
  # fallback engine serves requests) and its call sites received a targeted
  # audit; the advisory-per-call output carries no further signal.
  flawfinder:
    exclude_paths:
      - "packages/graph/src/graph/engines/c/**"
  # The engine's configuration references a rule id that does not exist
  # ("Unknown rule scss_function-disallowed-list"), producing an error on
  # every analyzed CSS file. The :not() notation findings it did report are
  # fixed in the stylesheets themselves.
  stylelint:
    exclude_paths:
      - "apps/web/**"
  # Reports every call to memcpy/strlen/memset/getenv/open/... as an audit
  # advisory regardless of surrounding guards, and its use-after-free matches
  # are re-assignment pairs it cannot track. A per-site audit of the first-party
  # C tree verified the flagged call sites (hardened in an earlier sweep) and
  # found no vulnerable usage.
  opengrep:
    exclude_paths:
      - "packages/graph/src/graph/engines/c/**"
  # Reports unused struct members per translation unit and cannot see
  # cross-TU reads; the flagged members were audited individually and are
  # read from other TUs or reserved for wire/disk layouts. The one real
  # variadic-sentinel defect it found (varFuncNullUB) is fixed in code.
  cppcheck:
    exclude_paths:
      - "packages/graph/src/graph/engines/c/**"
  # Duplicates the standalone Bandit, Pylint, and pyflakes findings already
  # reported by those tools; its remaining unique output is the mccabe
  # complexity metric, which no repository gate enforces.
  prospector:
    exclude_paths:
      - "**/*.py"
  # Write-Host in the build/test scripts is intentional console output
  # (colored progress for the developer, not pipeline data).
  psscriptanalyzer:
    exclude_paths:
      - "packages/graph/src/graph/engines/c/core/scripts/**"
  # Reports function length / file size / parameter count as advisory
  # metrics; no repository gate enforces size limits, and the flagged
  # functions were reviewed without finding defects.
  lizard:
    exclude_paths:
      - "packages/**"
      - "agent/**"
      - "apps/web/**"
