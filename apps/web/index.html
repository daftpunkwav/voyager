<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <!--
      Theme first-paint sync (§10.11):
      before React hydrates, set data-theme from the localStorage-persisted theme or the system preference,
      avoiding a first-paint flash in system mode.
      The script lives in /theme-init.js (a classic script, so it still blocks parsing and runs
      before the first paint) instead of an inline block, so the shipped policy needs no
      'unsafe-inline'; the store keys travel with the script tag as data attributes.
    -->
    <script
      src="/theme-init.js"
      data-ui-store-key="%UI_STORE_KEY%"
      data-ui-store-legacy-key="%UI_STORE_LEGACY_KEY%"
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="%PRODUCT_NAME% — %PRODUCT_TAGLINE%" />
    <meta name="theme-color" content="#007aff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a2540" media="(prefers-color-scheme: dark)" />
    <!--
      Content Security Policy (§4.2 security):
      - default-src 'self'   resources are same-origin by default
      - script-src 'self'   no inline script and no eval in the page: the
        first-paint sync ships as /theme-init.js, and the fenced code runner
        executes in /code-runner-worker.js, a worker of its own whose policy
        comes with its response rather than with the page. Injection stays
        guarded by the markdown sanitize allowlist, not by script-src.
        The dev server adds 'unsafe-inline' to this directive for the React
        Fast Refresh preamble it injects (see vite.config.ts).
      - worker-src 'self'   the code-runner worker is served from the app
      - style-src 'self' 'unsafe-inline'   CSS allows inline (liquid-glass dynamic tokens); fonts are self-hosted via @fontsource-variable
      - font-src 'self' data:   self-hosted woff2 + embedded fonts
      - img-src 'self' data: https:   avatars/icons/external images
      - connect-src 'self' ws: wss: http://127.0.0.1:8000   same-origin + WebSocket (SSE) + dev backend
      - object-src 'none'   no plugin content anywhere in the app
      - base-uri 'self'   prevents base href hijacking
      - form-action 'self'   prevents cross-origin form submission
      - frame-ancestors must be set via an HTTP header (browsers ignore the meta tag, per the W3C spec);
        dev injects it via server.headers in vite.config.ts; prod adds it via the gateway response header
        'Content-Security-Policy: ...; frame-ancestors \"none\"'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        worker-src 'self';
        object-src 'none';
        style-src 'self' 'unsafe-inline';
        font-src 'self' data:;
        img-src 'self' data: https:;
        connect-src 'self' ws: wss: http://127.0.0.1:8000;
        base-uri 'self';
        form-action 'self';
      "
    />
    <title>%PRODUCT_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
